<div class="flex flex-wrap gap-10 space-y-4 justify-around">
  @for (r of referrals(); track $index) {
    <div
      class="card max-w-sm"
      pAnimateOnScroll
      enterClass="animate-enter zoom-in-50 slide-in-from-b-8 animate-duration-1000"
      leaveClass="animate-leave fade-out-10 animate-duration-1000"
      [once]="true"
    >
      <p-message severity="info">
        <ngx-typed-writer
          [strings]="['<q>' + [r.comment] + '</q>']"
          [isHTML]="true"
          [loop]="false"
          [typeSpeed]="35"
          [showCursor]="false"
        ></ngx-typed-writer>
      </p-message>
      <div class="flex items-center justify-between">
        <div class="flex flex-col m-2">
          <span class="ms-2">{{ r.name }}</span>
          <span class="ms-2 text-muted-color">{{ r.title }}</span>
          <span class="ms-2 text-muted-color"
            >{{ r.company }}
            <a
              href="{{ r.url }}"
              target="_blank"
              rel="noopener"
              class="social"
              aria-label="LinkedIn profile"
              ><i class="ri-linkedin-box-fill"></i
            ></a>
          </span>
        </div>
        <p-avatar image="{{ r.pic }}" shape="circle" class="min-w-15 min-h-15" />
      </div>
    </div>
  }
</div>
