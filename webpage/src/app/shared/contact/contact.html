<div
  class="flex justify-center"
  style="background-color: #111214"
  pAnimateOnScroll
  enterClass="animate-enter zoom-in-50 slide-in-from-b-8 animate-duration-1000"
  leaveClass="animate-leave fade-out-10 animate-duration-1000"
  [once]="true"
>
  <p-fieldset legend="Contact" class="max-w-md w-full">
    <div class="flex flex-col gap-6 text-sm p-2">
      <div class="flex items-center justify-around">
        <img
          class="avatar"
          src="lester.jpeg"
          alt="Lester Pino Barragan portrait"
          fetchpriority="high"
          decoding="async"
        />
        <div class="flex justify-center">
          <p-message severity="info" (click)="this.visible = true">
            <ngx-typed-writer
              [strings]="[
                'Hey there! I\'m Lester, nice to meet you! Below, you\'ll find testimonials from peers and colleagues I\'ve had the pleasure of working with. Want to connect? ' +
                  '<p-tag class=\'text-accent-neon-blue rounded-md animate-pulse\'>' +
                  ' Click this message' +
                  '</p-tag>' +
                  ' to find my socials and get in touch! ',
              ]"
              [loop]="false"
              [typeSpeed]="35"
              [showCursor]="false"
              [isHTML]="true"
            ></ngx-typed-writer>
          </p-message>
          <p-dialog
            [(visible)]="visible"
            [modal]="true"
            header="Contact Info"
            [style]="{ width: '24rem' }"
          >
            <div class="w-80">
              <div class="flex flex-col gap-6">
                <div class="flex gap-8">
                  <div>
                    <div class="font-medium">Phone</div>
                    <div class="text-muted-100">+1 (778) 302-5374</div>
                  </div>
                </div>
                <div>
                  <div class="font-medium">Email</div>
                  <div class="text-muted-100">lesterivpino@gmail.com</div>
                </div>
                <div>
                  <div class="font-medium">LinkedIn</div>
                  <div class="text-muted-100">
                    <a target="_blank" href="https://www.linkedin.com/in/lesterpino/"
                      >/in/lesterpino</a
                    >
                  </div>
                </div>
                <p-tag severity="success" class="justify-center animate-pulse">Available</p-tag>
              </div>
            </div>
          </p-dialog>
        </div>
      </div>
    </div>
  </p-fieldset>
</div>
