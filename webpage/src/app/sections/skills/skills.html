<section class="py-16 px-4 sm:px-6" id="contact">
  <header>
    <h2>Let's build something together.</h2>
  </header>

  <div>
    <div class="flex flex-wrap-reverse justify-evenly items-center py-8">
      <div
        pAnimateOnScroll
        enterClass="animate-enter zoom-in-50 slide-in-from-b-8 animate-duration-1000"
        leaveClass="animate-leave fade-out-10 animate-duration-1000"
        [once]="true"
      >
        <p-chart type="radar" [data]="data" [options]="options" class="w-full md:w-[30rem]" />
      </div>

      <div
        pAnimateOnScroll
        enterClass="animate-enter fade-in-10 slide-in-from-b-8 animate-duration-1000"
        leaveClass="animate-leave fade-out-10 animate-duration-1000"
        [once]="true"
      >
        <contact-card />
      </div>
    </div>
    <reference-card />
  </div>
</section>
