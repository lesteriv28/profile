# This is a basic workflow that is manually triggered

name: Publish Site

concurrency:
  group: production-deployment
  cancel-in-progress: false
# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      run_id: 
        description: 'Run ID from Build workflow'
        required: true
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy-static:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

    - name: Validate run
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_RUN_ID: ${{ inputs.run_id }}

      run:  |
       gh api "repos/${{ github.repository }}/actions/runs/${BUILD_RUN_ID}" > run.json

       jq -e '
       .conclusion == "success" and
       .event == "push" and
       .head_branch == "master" and
       .path == ".github/workflows/build.yml"
       ' run.json
       
    # Runs a single command using the runners shell
    - name: Download Angular artifact
      uses: actions/download-artifact@v4
      with:
       name: angular-dist
       run-id: ${{ inputs.run_id }}
       github-token: ${{ github.token }}
       path: ./public
       
    - name: Verify static site
      run: test -f ./public/index.html

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: deployment
        persist-credentials: true
        path: ./site

    - name: Configure Git
      working-directory: ./site
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    
    - name: Synchronize static files
      run: rsync -av --delete --exclude='.git/' ./public/ ./site/

    - name: Stage changes
      run: git add -A
      working-directory: ./site
      
    - name: Inspect deployment changes
      working-directory: ./site
      run: |
       git status --short
       git diff --cached --stat  
       
    - name: Create commit
      run: |
       if ! git diff --cached --quiet; then
         git commit -m "Deploy build ${{ inputs.run_id }}"
       else
         echo "No changes to commit"
       fi
      working-directory: ./site
       
    - name: Push to remote
      run: git push
      working-directory: ./site
